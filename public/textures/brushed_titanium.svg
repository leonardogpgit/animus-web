<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="120" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sheen-ti" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd0d8" />
      <stop offset="25%" stop-color="#eaedf2" />
      <stop offset="48%" stop-color="#d3d8e0" />
      <stop offset="50%" stop-color="#f4f6fa" />
      <stop offset="52%" stop-color="#d3d8e0" />
      <stop offset="75%" stop-color="#e4e8ee" />
      <stop offset="100%" stop-color="#b8bec8" />
    </linearGradient>
    <filter id="brushed-ti" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" result="mono" />
      <feComponentTransfer result="grain">
        <feFuncR type="linear" slope="0.35" intercept="0.82" />
        <feFuncG type="linear" slope="0.35" intercept="0.82" />
        <feFuncB type="linear" slope="0.35" intercept="0.82" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="grain" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#sheen-ti)" filter="url(#brushed-ti)" />
</svg>